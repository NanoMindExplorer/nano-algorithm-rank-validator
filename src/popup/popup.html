<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nano Algorithm Rank Validator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="logo-img" src="../../icons/icon48.png" width="40" height="40" alt="NARV" />
      <div>
        <h1>Nano Algorithm Rank Validator</h1>
        <p class="sub">v1.3 · by @Deadmouse_jpeg</p>
      </div>
    </header>

    <section id="gate-block" class="gate" hidden>
      <p class="gate-title">🔒 Follow required</p>
      <p class="gate-text">
        Tools ini hanya bisa dipakai setelah kamu follow
        <strong>@Deadmouse_jpeg</strong> di X.
      </p>
      <a
        class="primary link-btn"
        href="https://x.com/Deadmouse_jpeg"
        target="_blank"
        rel="noopener noreferrer"
        >Follow @Deadmouse_jpeg</a
      >
      <button id="btn-recheck" type="button">Saya sudah follow — cek ulang</button>
      <p class="note dim" id="gate-msg"></p>
    </section>

    <section id="actions-block" class="actions" hidden>
      <button id="btn-validate" class="primary">Validate active tweet</button>
      <button id="btn-scan">Scan visible timeline</button>
      <button id="btn-compare">A/B profile compare</button>
      <button id="btn-sample">Engagement sampler</button>
      <button id="btn-open">Open side panel</button>
      <button id="btn-options" class="ghost">All settings</button>
    </section>

    <section class="info">
      <p class="note">
        <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> validate ·
        <kbd>C</kbd> compare · <kbd>S</kbd> sample
      </p>
      <p class="note dim" id="profile-line">Profile: —</p>
    </section>

    <footer>
      <a href="https://x.com/Deadmouse_jpeg" target="_blank" rel="noreferrer">@Deadmouse_jpeg ↗</a>
      <span id="status"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
