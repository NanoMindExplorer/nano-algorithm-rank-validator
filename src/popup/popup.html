<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nano Algorithm Rank Validator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo">NΔ</div>
      <div>
        <h1>Nano Algorithm Rank Validator</h1>
        <p class="sub">v1.2 · full algorithm toolkit</p>
      </div>
    </header>

    <section class="actions">
      <button id="btn-validate" class="primary">Validate active tweet</button>
      <button id="btn-scan">Scan visible timeline</button>
      <button id="btn-compare">A/B profile compare</button>
      <button id="btn-sample">Engagement sampler</button>
      <button id="btn-open">Open side panel</button>
      <button id="btn-options" class="ghost">All settings</button>
    </section>

    <section class="info">
      <h2>v1.2 complete</h2>
      <ul>
        <li>Profiles + A/B compare</li>
        <li>Affinity + likes sampler</li>
        <li>CSV/JSON export</li>
        <li>Sidecar hash / proxy / jax</li>
      </ul>
      <p class="note">
        <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> validate ·
        <kbd>C</kbd> compare · <kbd>S</kbd> sample
      </p>
      <p class="note dim" id="profile-line">Profile: —</p>
    </section>

    <footer>
      <a
        href="https://github.com/NanoMindExplorer/nano-algorithm-rank-validator"
        target="_blank"
        rel="noreferrer"
        >Repo ↗</a
      >
      <span id="status"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
